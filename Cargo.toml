[package]
name = "native-lsp"
version = "0.1.0"
edition = "2021"
description = "Low-RAM native Language Server Protocol implementation without Node.js"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "native-lsp"
path = "src/main.rs"

[[bin]]
name = "compare-rss"
path = "src/bin/compare_rss.rs"

[[bin]]
name = "native-ide"
path = "src/bin/native_ide.rs"

[[bin]]
name = "compare-hosts"
path = "src/bin/compare_hosts.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
